<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Tide • Student Planner, 3D Avatar & Cloud Sync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Local Three.js with CDN fallback for 3D Stumble Avatar -->
  <script src="three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>

  <!-- Local Supabase JS SDK with CDN fallback -->
  <script src="supabase.min.js"></script>
  <script>
    if (typeof supabase === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"><\/script>');
    }
  </script>

  <style>
    :root {
      color-scheme: dark;
      --f1: Outfit, "Helvetica Neue", system-ui, -apple-system, sans-serif;
      --bg: #03040d;
      --ink: #eef2ff;
      --mut: #94a3b8;
      --sf: rgba(10, 16, 38, 0.72);
      --bd: rgba(255, 255, 255, 0.15);
      --gl: rgba(255, 255, 255, 0.08);
      --ac: #38bdf8;
      --ac-glow: rgba(56, 189, 248, 0.35);
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      box-sizing: border-box;
    }
    @media(prefers-color-scheme:dark) {
      :root:not([data-theme]) {
        --bg: #070b14;
        --ink: #eaf2ff;
        --mut: #9fb0cf;
        --sf: rgba(12, 20, 42, 0.78);
        --bd: rgba(255, 255, 255, 0.15);
        --gl: rgba(255, 255, 255, 0.1);
        --ac: #2dd4bf;
        --ac-glow: rgba(45, 212, 191, 0.35);
      }
    }
    :root[data-theme="midnight"] {
      --bg: #070b14;
      --ink: #eaf2ff;
      --mut: #9fb0cf;
      --sf: rgba(12, 20, 42, 0.78);
      --bd: rgba(255, 255, 255, 0.15);
      --gl: rgba(255, 255, 255, 0.1);
      --ac: #2dd4bf;
      --ac-glow: rgba(45, 212, 191, 0.35);
    }
    :root[data-theme="sunset"] {
      --bg: #1a0b14;
      --ink: #fff1ea;
      --mut: #e3b8b2;
      --sf: rgba(42, 15, 30, 0.78);
      --bd: rgba(255, 255, 255, 0.16);
      --gl: rgba(255, 255, 255, 0.1);
      --ac: #ff7a59;
      --ac-glow: rgba(255, 122, 89, 0.35);
    }
    :root[data-theme="matcha"] {
      --bg: #07140e;
      --ink: #eafff3;
      --mut: #a6cdb5;
      --sf: rgba(10, 32, 21, 0.78);
      --bd: rgba(255, 255, 255, 0.15);
      --gl: rgba(255, 255, 255, 0.1);
      --ac: #86efac;
      --ac-glow: rgba(134, 239, 172, 0.35);
    }
    :root[data-theme="nebula"] {
      --bg: #0d0618;
      --ink: #fdf0ff;
      --mut: #d3b0e6;
      --sf: rgba(30, 10, 50, 0.65);
      --bd: rgba(255, 255, 255, 0.16);
      --gl: rgba(255, 255, 255, 0.09);
      --ac: #f0abfc;
      --ac-glow: rgba(240, 171, 252, 0.35);
    }
    :root[data-theme="grape"] {
      --bg: #100a1f;
      --ink: #f3eeff;
      --mut: #bba9e6;
      --sf: rgba(28, 17, 54, 0.78);
      --bd: rgba(255, 255, 255, 0.16);
      --gl: rgba(255, 255, 255, 0.1);
      --ac: #c4b5fd;
      --ac-glow: rgba(196, 181, 253, 0.35);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font: 300 15px/1.5 var(--f1);
      letter-spacing: .01em;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    #bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }
    main {
      position: relative;
      z-index: 1;
      max-width: 1420px;
      margin: auto;
      padding: 82px clamp(16px, 3.5vw, 40px) 120px;
      width: 100%;
    }

    /* Glass Surfaces */
    .glass {
      position: relative;
      overflow: hidden;
      background: var(--gl);
      border: 1px solid var(--bd);
      backdrop-filter: blur(18px) saturate(175%);
      -webkit-backdrop-filter: blur(18px) saturate(175%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 12px 30px rgba(0, 0, 0, 0.25);
    }
    .surface {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 24px;
      padding: 22px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      margin-bottom: 16px;
      position: relative;
    }

    /* Buttons */
    .btn {
      font-weight: 500;
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      padding: 11px 24px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      border: 1px solid var(--bd);
      background: var(--gl);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      user-select: none;
      white-space: nowrap;
    }
    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }
    .btn:active { transform: scale(0.96); }
    .pri {
      background: linear-gradient(135deg, #2dd4bf, #38bdf8);
      color: #04121a;
      border: 0;
      font-weight: 600;
      box-shadow: 0 4px 16px var(--ac-glow);
    }
    .pri:hover {
      box-shadow: 0 8px 24px var(--ac-glow);
    }
    .on2 { outline: 2px solid var(--ac); }

    /* Typography & Utilities */
    .big {
      font-size: clamp(44px, 7vw, 104px);
      font-weight: 200;
      letter-spacing: -0.035em;
      line-height: 0.98;
      margin: 0.2em 0;
    }
    .big.sm { font-size: clamp(32px, 6vw, 56px); }
    .mut { color: var(--mut); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .num { font-size: 38px; font-weight: 300; letter-spacing: -0.03em; display: block; }
    b { font-weight: 500; }
    h2, h3 { font-weight: 300; }
    .big, .num, h2, h3, .gc b, .wm { font-family: var(--f1); }

    @keyframes up {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pg > * {
      animation: up 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      animation-delay: calc(var(--i, 0) * 45ms);
    }

    /* TOPBAR: Adaptive & Widescreen */
    #topbar {
      position: fixed;
      top: calc(10px + var(--sat));
      left: 50%;
      transform: translateX(-50%);
      width: min(1420px, calc(100% - 24px));
      height: 54px;
      border-radius: 999px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 12px;
    }
    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Brand logo shown on home page */
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      user-select: none;
      text-decoration: none;
      cursor: pointer;
    }
    .brand-icon {
      font-size: 20px;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #2dd4bf, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: var(--f1);
    }

    .nav-btn {
      height: 38px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--bd);
      background: var(--gl);
      color: var(--ink);
      font: 500 13px var(--f1);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      user-select: none;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }
    .nav-btn:active { transform: scale(0.95); }
    .nav-btn.on {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      color: var(--ink);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.15);
    }
    .nav-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-hidden { display: none !important; }
    
    .profile-chip {
      height: 38px;
      padding: 3px 12px 3px 5px;
      border-radius: 999px;
      border: 1px solid var(--bd);
      background: var(--gl);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .profile-chip:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }
    .avatar-mini-ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2dd4bf, #38bdf8);
      display: grid;
      place-items: center;
      font-size: 13px;
      box-shadow: 0 0 10px var(--ac-glow);
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      flex-shrink: 0;
    }
    .avatar-mini-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-chip-name {
      font-size: 13px;
      font-weight: 500;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .profile-chip-lvl {
      font-size: 11px;
      background: var(--ac);
      color: #04121a;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 999px;
    }
    .cloud-pill-btn {
      height: 38px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--bd);
      background: var(--gl);
      color: var(--ink);
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cloud-pill-btn:hover { background: rgba(255,255,255,0.18); }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-green { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot-yellow { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

    #th {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--ink);
      cursor: pointer;
      padding: 0;
      border: 1px solid var(--bd);
      background: var(--gl);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    #th:hover { transform: scale(1.06); }
    #th svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* DOCK NAVIGATION: Responsive 7-Tab Layout */
    #dock {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(12px + var(--sab));
      display: flex;
      padding: 5px;
      border-radius: 999px;
      z-index: 50;
      width: min(540px, calc(100% - 20px));
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }
    #dock a {
      position: relative;
      z-index: 1;
      flex: 1;
      min-width: 0;
      height: 44px;
      display: grid;
      place-items: center;
      color: var(--mut);
      transition: color 0.3s;
      text-decoration: none;
    }
    #dock a.on { color: var(--ink); }
    #dock a[data-p=profile].on { color: #f472b6; }
    #dock a[data-p=recover] { color: var(--ac); }
    #dock svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #pl {
      position: absolute;
      top: 5px;
      height: 44px;
      border-radius: 999px;
      background: var(--gl);
      box-shadow: inset 0 0 0 1px var(--bd), 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: left 0.4s cubic-bezier(0.3, 1.4, 0.4, 1), width 0.4s;
    }

    /* HERO SECTION: Authentic to Old Design, Left-aligned, Widescreen Responsive */
    .hero {
      min-height: 52vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      text-align: left;
      padding: 16px 0 20px;
      margin-bottom: 12px;
      width: 100%;
    }
    .big {
      font-size: clamp(48px, 9.5vw, 108px);
      font-weight: 200;
      letter-spacing: -0.035em;
      line-height: 0.95;
      margin: 0.2em 0;
      text-align: left;
    }
    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 18px;
      margin-left: 74px;
      position: relative;
      z-index: 5;
    }
    
    /* FLOATING STICKERS */
    .stk {
      position: absolute;
      z-index: 1;
      width: clamp(54px, 10vw, 88px);
      animation: fl 6s ease-in-out infinite;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
      pointer-events: none;
      user-select: none;
    }
    .stk svg, .ico svg { width: 100%; height: auto; display: block; }
    .ico { width: 44px; display: block; margin-bottom: 6px; }
    @keyframes fl {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(3deg); }
    }

    /* CONTINUOUS SMOOTH MARQUEE TICKER (LOOPING INFINITELY) */
    .mq {
      overflow: hidden;
      margin: 20px 0 28px;
      width: 100%;
      position: relative;
      white-space: nowrap;
      padding: 4px 0;
      mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
    }
    .mq-track {
      display: inline-flex;
      gap: 12px;
      width: max-content;
      animation: mqLoop 25s linear infinite;
      will-change: transform;
    }
    @keyframes mqLoop {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* LOWER SECTION: Widescreen balanced layout */
    .lg {
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr;
      gap: 32px;
      align-items: center;
      margin-top: 14px;
      width: 100%;
    }
    .phone {
      width: min(280px, 76vw);
      height: 420px;
      border-radius: 40px;
      margin: auto;
      position: relative;
      overflow: hidden;
    }
    .pb {
      position: absolute;
      left: 16px;
      right: 16px;
      border-radius: 13px;
      padding: 7px 10px;
      font: 500 12px var(--f1);
      color: #06121a;
    }
    .b2 { animation: b2 7s infinite; }
    @keyframes b2 {
      0%, 34% { top: 160px; opacity: 1; filter: none; }
      40% { top: 160px; opacity: 0; filter: blur(6px); }
      41% { top: 300px; opacity: 0; }
      52%, 90% { top: 300px; opacity: 1; filter: none; box-shadow: 0 0 0 2px var(--ac), 0 0 20px var(--ac); }
      97% { top: 300px; opacity: 0; }
      100% { top: 160px; opacity: 0; }
    }
    .tp2 {
      left: 50%;
      right: auto;
      width: 100px;
      margin-left: -50px;
      text-align: center;
      top: 16px;
      background: var(--ac);
      animation: tpk 7s infinite;
    }
    @keyframes tpk {
      0%, 25%, 45%, 100% { transform: scale(1); }
      32% { transform: scale(0.88); box-shadow: 0 0 0 14px color-mix(in srgb, var(--ac) 25%, transparent); }
    }
    .rg {
      position: absolute;
      left: 50%;
      top: 30px;
      width: 20px;
      height: 20px;
      margin: -10px;
      border: 2px solid var(--ac);
      border-radius: 50%;
      opacity: 0;
      animation: rgk 7s infinite;
    }
    @keyframes rgk {
      0%, 31% { opacity: 0; transform: scale(1); }
      32% { opacity: 1; }
      46% { opacity: 0; transform: scale(16); }
      100% { opacity: 0; }
    }
    .feature-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }
    .feature-stack .surface {
      padding: 24px 28px;
      margin-bottom: 0;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .feature-stack .surface:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(0,0,0,0.3);
    }
    @media(max-width: 860px) {
      .lg {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .phone {
        margin: 0 auto 16px;
      }
      .hero {
        min-height: 44vh;
      }
    }

    /* FAST DEMO VIDEO (Snappy 4.5s & Auto-Dismiss) */
    .vid {
      width: min(340px, calc(100% - 20px));
      margin: 6px auto 22px;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--bd);
      background: rgba(4, 8, 24, 0.85);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
      transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      max-height: 380px;
    }
    .vid.vid-exit {
      opacity: 0;
      transform: scale(0.92) translateY(-22px);
      max-height: 0;
      margin-top: 0;
      margin-bottom: 0;
      padding: 0;
      border-width: 0;
      pointer-events: none;
    }
    .vid-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 13px;
      border-bottom: 1px solid var(--bd);
      font-size: 12px;
      font-weight: 500;
      color: var(--mut);
    }
    .vid-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--ac);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 11px;
    }
    .vid-badge span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ac);
      animation: pulseDot 1s infinite alternate;
    }
    @keyframes pulseDot { from { opacity: 0.4; } to { opacity: 1; } }
    .vid-close-btn {
      background: none;
      border: none;
      color: var(--mut);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .vid-close-btn:hover { color: #fb7185; }

    .vs { height: 155px; position: relative; overflow: hidden; }
    .sc {
      position: absolute;
      inset: 0;
      padding: 12px;
      opacity: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      align-items: center;
      animation: scFast 4.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    .sc:nth-child(1) { animation-delay: 0s; }
    .sc:nth-child(2) { animation-delay: 1.1s; }
    .sc:nth-child(3) { animation-delay: 2.2s; }
    .sc:nth-child(4) { animation-delay: 3.3s; }

    @keyframes scFast {
      0% { opacity: 0; transform: scale(0.95); }
      4%, 21% { opacity: 1; transform: scale(1); }
      24%, 100% { opacity: 0; transform: scale(1.02); }
    }
    .vin { border: 1px solid var(--bd); border-radius: 999px; padding: 7px 15px; font-size: 13px; background: var(--gl); }
    .ty { display: inline-block; overflow: hidden; white-space: nowrap; vertical-align: bottom; width: 0; animation: tyFast 4.5s steps(17) forwards; }
    @keyframes tyFast { 0% { width: 0; } 6%, 22% { width: 17ch; } 25%, 100% { width: 17ch; } }
    .mg { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--bd); position: relative; overflow: hidden; display: grid; place-items: center; }
    .mg b { position: relative; font-size: 20px; font-weight: 300; z-index: 1; }
    .mw { position: absolute; left: 0; right: 0; bottom: 0; background: #fb7185; opacity: 0.75; animation: mwFast 4.5s forwards; }
    @keyframes mwFast { 0%, 24% { height: 8%; } 32%, 100% { height: 85%; } }
    .mb { display: block; height: 13px; border-radius: 7px; margin: 3px 0; animation: mbFast 4.5s forwards; }
    @keyframes mbFast { 0%, 48% { transform: translateX(-30px); opacity: 0; } 54%, 70% { transform: none; opacity: 1; } 72%, 100% { opacity: 0; } }
    .mp { animation: mpFast 4.5s forwards; }
    @keyframes mpFast { 0%, 72% { transform: scale(1); } 76% { transform: scale(0.88); box-shadow: 0 0 0 10px var(--ac-glow); } 82%, 100% { transform: scale(1); } }
    .mx { animation: mxFast 4.5s forwards; }

  <script>
    const $ = s => document.querySelector(s);
    const now = new Date(), dn = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], D = 7, WK = 8, SL = 30, MULT = 1.25, H = 18;
    const dN = i => i ? dn[(now.getDay()+i)%7] : 'Today';
    const col = s => `hsl(${[...s].reduce((a,c)=>a+c.charCodeAt(0)*13,0)%360} 80% 68%)`;
    const dur = m => ((m>=60 ? Math.floor(m/60)+'h ' : '') + (m%60 ? m%60+'m' : '')).trim();
    const pr = s => { const h = WK + s/2; return h>=9&&h<12 ? 0 : h>=15&&h<18 ? 1 : h>=12&&h<15 ? 2 : 3; };
    const RM = matchMedia('(prefers-reduced-motion: reduce)').matches, isL = () => 0;

    const TH = {
      midnight: { a:[.05,.6,.66], b:[.4,.42,.95] },
      sunset:   { a:[.95,.3,.5],  b:[.98,.6,.25] },
      matcha:   { a:[.1,.66,.4],  b:[.7,.86,.3] },
      grape:    { a:[.55,.3,.95], b:[.95,.4,.75] },
      nebula:   { a:[.9,.25,.6],  b:[.3,.4,1] }
    };
    const PAL = () => TH[S.theme] || TH.midnight;

    let routeHistory = [''];
    let demoCompletedAndDismissed = false;

    /* SUPABASE BACKEND CONTROLLER */
    const DEFAULT_SB_URL = 'https://urgoewkatpxpccbixbwn.supabase.co';
    const DEFAULT_SB_KEY = 'sb_publishable_SuGOU4wfA4vTygM_ROditw_Xo6gIykK';

    const CloudBackend = {
      client: null,
      init() {
        const url = (S.supabase && S.supabase.url) || DEFAULT_SB_URL;
        const key = (S.supabase && S.supabase.anonKey) || DEFAULT_SB_KEY;
        if (!url || !key) return false;
        try {
          if (typeof supabase !== 'undefined' && supabase.createClient) {
            this.client = supabase.createClient(url, key);
            return true;
          }
        } catch (e) {
          console.warn('Supabase init error:', e);
        }
        return false;
      },
      async testConnection() {
        if (!this.init()) return { success: false, msg: 'Missing Supabase URL or Publishable API Key.' };
        try {
          const t0 = performance.now();
          const { data, error } = await this.client.from('tide_profiles').select('id').limit(1);
          const latency = Math.round(performance.now() - t0);
          if (error && (error.code === '42P01' || error.code === 'PGRST205')) {
            S.supabase.connected = true;
            save();
            return { success: true, tableMissing: true, latency, msg: `Connected to Supabase! (${latency}ms) Note: Run the SQL Schema in Supabase SQL Editor to initialize tables.` };
          }
          if (error) throw error;
          S.supabase.connected = true;
          S.supabase.lastSync = new Date().toLocaleTimeString();
          save();
          return { success: true, latency, msg: `Connected successfully! (${latency}ms)` };
        } catch (e) {
          return { success: false, msg: e.message || 'Connection failed.' };
        }
      },
      async syncToCloud() {
        if (!this.init()) return { success: false, msg: 'Configure Supabase credentials first.' };
        try {
          const prof = S.profile;
          const { error: profErr } = await this.client.from('tide_profiles').upsert({
            id: 'default_student',
            name: prof.name,
            handle: prof.handle,
            grade: prof.grade,
            school: prof.school,
            motto: prof.motto,
            weekly_target: prof.weeklyTarget,
            streak: prof.streak,
            photo_url: prof.photo || null,
            avatar_data: prof.avatar || {},
            updated_at: new Date().toISOString()
          });
          if (profErr) {
            if (profErr.code === 'PGRST205' || profErr.code === '42P01') {
              return { success: false, msg: 'Tables missing in Supabase. Please copy and run the SQL Schema first.' };
            }
            throw profErr;
          }

          if (S.tasks && S.tasks.length) {
            const taskRows = S.tasks.map(t => ({
              id: t.id,

        } catch (e) {

      },
      async pullFromCloud() {
        if (!this.init()) return { success: false, msg: 'Configure Supabase credentials first.' };

          const { data: tasks, error: tasksErr } = await this.client.from('tide_tasks').select('*').eq('user_id', 'default_student');
          if (tasksErr && tasksErr.code !== 'PGRST205' && tasksErr.code !== '42P01') throw tasksErr;

              fs: t.first_step || ''
            }));

          S.supabase.connected = true;
          S.supabase.lastSync = new Date().toLocaleTimeString();
          save();
          return { success: true, msg: `Cloud data loaded at ${S.supabase.lastSync}` };
        } catch (e) {
          return { success: false, msg: e.message || 'Pull failed.' };
        }
      }

      return e;

    function free(d) {
      const g = Array(SL).fill(0);
      S.ev.filter(e => e.d == d).forEach(e => {
        for (let h = e.s; h < e.e; h += 0.5) {
          const i = Math.round((h - WK) * 2);
          if (i >= 0 && i < SL) g[i] = 1;
        }
      });
      if (!d) {
        const c = Math.ceil((now.getHours() + now.getMinutes()/60 - WK) * 2) + 1;
        for (let i = 0; i < Math.min(c, SL); i++) g[i] = 1;
      }

      const g = [...Array(D)].map((_, d) => free(d)), used = Array(D).fill(0), blocks = [], unfit = [];
      const put = b => {
        blocks.push(b);
        for (let k = 0; k <= b.n; k++) if (b.s + k < SL) g[b.d][b.s + k] = 1;
        used[b.d] += b.n * 30;
      };
      keep.forEach(put);
      [...tasks].sort((a,b) => a.due*24 + a.dh - b.due*24 - b.dh || b.imp - a.imp).forEach(t => {
        let need = Math.ceil(t.est * MULT / 30) * 30 - keep.filter(b => b.tid == t.id).reduce((a, b) => a + b.n * 30, 0);
        while (need > 0) {
          let hit = null;
          for (let n = Math.min(3, need / 30); n >= 1 && !hit; n--) {
            for (let d = 0; d < D && d <= t.due && !hit; d++) {
              if (used[d] + n * 30 > cap[d]) continue;
              const lim = d == t.due ? Math.floor((t.dh - WK) * 2) : SL, c = [];
              for (let s = 0; s + n <= Math.min(lim, SL); s++) {
                let ok = 1;
                for (let k = 0; k < n; k++) if (g[d][s + k]) { ok = 0; break; }
                ok && c.push(s);
              }
              if (c.length) {
                c.sort((a, b) => pr(a) - pr(b) || a - b);
                hit = { d, s: c[0], n };
              }
            }
          }
          if (!hit) { unfit.push({ t, min: need }); break; }
          put({ id: t.id + '-' + hit.d + '-' + hit.s, tid: t.id, d: hit.d, s: hit.s, n: hit.n, done: 0 });
          need -= hit.n * 30;
        }

              <div style="flex:1;min-width:38px;text-align:center;font-size:12px">
                <div style="height:76px;border-radius:12px;background:var(--bd);position:relative;overflow:hidden">

        <div class="surface">
          ${tr.length ? `<p class="mut" style="margin-top:0">${tr[0].t.t}</p><div class="row">${tr.map((o, i) => `<button class="btn" data-a="tri" data-v="${i}">${o.n} · ${o.d}%</button>`).join('')}</div>` : ''}

            <button class="btn pri" data-a="go" data-v="#/week">Build plan</button>

      week() {
        const s = stats();
        return `
        <h1 class="big sm">Week</h1>
        <div class="row glass" style="padding:8px 14px;border-radius:999px;margin-bottom:12px;justify-content:space-between">
          <span class="ch">Load ${Math.round(s.r * 100)}%</span>

        ${tl(S.blocks)}
        <p class="mut" style="font-size:13px;margin-top:10px">💡 Tap any study block to mark done. Swipe horizontally on mobile.</p>`;
      },

      today() {
        const nb = S.blocks.filter(b => !b.done).sort((a, b) => a.d - b.d || a.s - b.s), b = nb[0];
        if (!b) return `
          <h1 class="big">All clear</h1>
          <div class="surface" style="text-align:center;padding:32px 16px">
            <span style="font-size:42px;display:block;margin-bottom:10px">🎉</span>

            <button class="btn pri" data-a="go" data-v="#/add" style="margin-top:12px">Add another task</button>
          </div>`;
        const t = tk(b), C = 2 * Math.PI * 54;
        const mins = Math.floor(timerSecondsLeft / 60);
        const secs = timerSecondsLeft % 60;
        const timeStr = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        const offset = C * (1 - (1500 - timerSecondsLeft) / 1500);

        return `
        <h1 class="big sm">${dN(b.d)}</h1>
        <div class="surface">
          <div class="row" style="justify-content:space-between;align-items:center">
            <div>
              <span class="ch" style="background:${col(t.sub)};color:#06121a;font-weight:600">${t.sub}</span>
              <h2 style="font-size:28px;margin:.3em 0;letter-spacing:-.03em">${t.t}</h2>
              <p class="mut" style="margin:0">Action step: ${t.fs}</p>
            </div>
            <div style="width:120px;position:relative;flex-shrink:0;margin:auto">
              <svg viewBox="0 0 130 130">
                <circle cx="65" cy="65" r="54" fill="none" stroke="var(--bd)" stroke-width="8"/>
                <circle id="tr" cx="65" cy="65" r="54" fill="none" stroke="var(--ac)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${offset}" transform="rotate(-90 65 65)" style="transition:stroke-dashoffset 0.5s ease"/>
              </svg>
              <div style="position:absolute;inset:0;display:grid;place-content:center"><b id="tt" style="font-size:22px">${timeStr}</b></div>
            </div>
          </div>

            <button class="btn" data-a="go" data-v="#/recover">I’m behind</button>
          </div>
        </div>
        <div class="surface">
          <h3 style="font-size:16px;margin:0 0 8px">Next Up Today</h3>
          ${nb.slice(1, 4).map(x => `
          <div class="lr">
            <span><i class="dot" style="background:${col(tk(x).sub)}"></i>${tk(x).t}</span>
            <span class="mut">${dN(x.d)} ${(WK + x.s / 2).toFixed(1).replace('.5', ':30').replace('.0', ':00')} · ${dur(x.n * 30)}</span>
          </div>`).join('')}
        </div>`;
      },

      add: () => `
        <h1 class="big sm">Add Task</h1>
        <div class="surface">
          <input class="ti" id="ti" placeholder="Physics lab fri 3h" autocomplete="off">
          <p id="pv" class="mut" style="font-size:13px;margin:8px 0 12px">Type a task, due day, and duration (e.g., 'Math tomorrow 2h').</p>
          <div class="row">
            <select id="sb" style="width:auto;flex:1;min-width:130px">
              ${[...new Set(S.tasks.map(t => t.sub).concat(['CS', 'Math', 'Physics', 'History', 'Other']))].map(s => `<option>${s}</option>`).join('')}
            </select>
            <span id="ip" class="row">
              <span class="mut" style="font-size:12px;margin-right:2px">Priority:</span>

          <div class="lr">
            <span><i class="dot" style="background:${col(t.sub)}"></i>${t.t}</span>

            </span>
          </div>`).join('')}
        </div>`,

      recover() {
        const ch = [['sick', '🤒 Sick day'], ['miss', '⏰ Missed block'], ['new', '⚡ New deadline'], ['low', '🔋 Low energy']];
        let h = `<h1 class="big sm">Recover</h1><div class="surface"><p class="mut" style="margin-top:0">Life happened? Tide rebalances your week in 1 tap without dropping critical deadlines.</p><div class="row">${ch.map(([k, n]) => `<button class="btn${PD && PD.k == k ? ' on2' : ''}" data-a="rec" data-v="${k}">${n}</button>`).join('')}</div></div>`;
        if (PD) {
          const o = new Set(PD.old.map(b => b.id)), n = new Set(PD.nb.map(b => b.id));
          const rm = PD.old.filter(b => !n.has(b.id)), ad = new Set(PD.nb.filter(b => !o.has(b.id)).map(b => b.id));
          h += `
          <div class="surface">
            <div class="row" style="justify-content:space-around;text-align:center">
              <div><b class="num" data-n="${rm.length}">0</b>moved</div>
              <div><b class="num" data-n="${ad.size}">0</b>new</div>

      review() {
        const pl = S.blocks.reduce((a, b) => a + b.n * 30, 0), dm = S.blocks.filter(b => b.done).reduce((a, b) => a + b.n * 30, 0);

        </div>
        <div class="surface">
          <h3 style="font-size:16px;margin:0 0 10px">Subject Breakdown</h3>
          ${Object.entries(sb).map(([k, [a, d]]) => `<div class="lr"><span><i class="dot" style="background:${col(k)}"></i>${k}</span><span class="mut">${dur(d) || '0m'} / ${dur(a)}</span></div>`).join('')}

          <label class="row" style="justify-content:space-between">
            Daily study cap <b>${S.cap}h</b>
            <input type="range" min="2" max="9" step=".5" value="${S.cap}" data-in="cap" style="padding:0">
          </label>
        </div>`;
      },

      /* STUDENT PROFILE & 3D AVATAR + PHOTO UPLOADER + SUPABASE BACKEND */

                  </div>

          <!-- STUDENT INFO & SUPABASE BACKEND CONTROLS -->

    function renderWardrobeItems() {

    function parse(s) {
      let est = 60, m = s.match(/(\d+(?:\.\d+)?)\s*h/i), due = 3;
      if (m) est = Math.round(+m[1] * 60);
      else if (m = s.match(/(\d+)\s*m(?:in)?\b/i)) est = +m[1];
      const l = s.toLowerCase();
      dn.forEach((n, i) => {
        if (l.includes(n.toLowerCase())) due = (i - now.getDay() + 7) % 7 || 7;
      });
      if (/tomorrow/.test(l)) due = 1;
      if (/today/.test(l)) due = 0;
      return {
        est,
        due: Math.min(due, 6),
        t: s.replace(/(\d+(?:\.\d+)?)\s*(h|m|min)\b|\b(due|by|tomorrow|today)\b|\b(mon|tue|wed|thu|fri|sat|sun)\w*/gi, '').replace(/\s+/g, ' ').trim() || s
      };
    }

      }
    }

create policy "Public access tide_blocks" on public.tide_blocks for all using (true) with check (true);

notify pgrst, 'reload schema';`;

    let renderer3D = null, scene3D = null, camera3D = null, animFrame3D = null;

    function init3DAvatar() {
      const canvas = $('#avatar-canvas');
      if (!canvas || typeof THREE === 'undefined') return;

      dispose3DAvatar();

      const container = $('#avatar-stage');
      const width = container.clientWidth || 320;
      const height = container.clientHeight || 300;

      scene3D = new THREE.Scene();

      camera3D = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
      camera3D.position.set(0, 0.85, 3.8);
      camera3D.lookAt(0, 0.5, 0);

      renderer3D = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer3D.setSize(width, height);
      renderer3D.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Lights
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444455, 0.9);
      scene3D.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
      dirLight.position.set(3, 6, 4);
      scene3D.add(dirLight);

      const rimLight = new THREE.PointLight(0x7dd3fc, 0.65, 10);
      rimLight.position.set(-3, 2, -2);
      scene3D.add(rimLight);

      characterGroup = new THREE.Group();
      scene3D.add(characterGroup);

      // Soft ground shadow
      const shadowGeo = new THREE.CircleGeometry(0.7, 32);
      const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 });
      shadowPlane = new THREE.Mesh(shadowGeo, shadowMat);
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.y = -0.55;
      characterGroup.add(shadowPlane);

      rigBody = new THREE.Group();
      characterGroup.add(rigBody);

      buildCharacterRig();
      update3DCharacterModel();

      // Mouse & Touch Drag Controls
      canvas.onpointerdown = e => {
        isDragging3D = true;
        prevMouseX = e.clientX;
        rotVelocity = 0;
      };
      window.onpointermove = e => {
        if (!isDragging3D) return;
        const delta = e.clientX - prevMouseX;
        prevMouseX = e.clientX;
        rotVelocity = delta * 0.012;
        charYaw += rotVelocity;
        if (characterGroup) characterGroup.rotation.y = charYaw;
      };
      window.onpointerup = () => { isDragging3D = false; };

      // Render Loop
      let clock = new THREE.Clock();
      function animate() {
        animFrame3D = requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();

        if (!isDragging3D) {
          if (S.profile.avatar.autoRotate) {
            charYaw += 0.008;
          } else {
            rotVelocity *= 0.92;
            charYaw += rotVelocity;
          }
          if (characterGroup) characterGroup.rotation.y = charYaw;
        }

        animateCharacter(elapsed);
        renderer3D.render(scene3D, camera3D);
      }
      animate();

      const ro = new ResizeObserver(() => {
        if (!container || !renderer3D || !camera3D) return;
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera3D.aspect = w / h;
        camera3D.updateProjectionMatrix();
        renderer3D.setSize(w, h);
      });
      ro.observe(container);
    }

    function triggerAvatarEmote(em) {

    function animateCharacter(t) {
      if (!rigBody || !headGroup || !leftArm || !rightArm || !leftLeg || !rightLeg) return;
      const em = currentEmote;

      if (em === 'dance') {
        const w = Math.sin(t * 8);
        rigBody.position.y = Math.abs(Math.sin(t * 8)) * 0.12;
        rigBody.rotation.z = w * 0.18;
        headGroup.rotation.z = -w * 0.22;
        leftArm.rotation.z = -0.5 + Math.sin(t * 8) * 0.8;
        rightArm.rotation.z = 0.5 - Math.sin(t * 8) * 0.8;
        leftLeg.rotation.x = Math.sin(t * 8) * 0.35;
        rightLeg.rotation.x = -Math.sin(t * 8) * 0.35;
      } else if (em === 'wave') {
        rigBody.position.y = Math.sin(t * 3) * 0.04;
        rigBody.rotation.z = 0;
        headGroup.rotation.z = 0.08;
        leftArm.rotation.z = 0.15;
        rightArm.rotation.z = 2.4 + Math.sin(t * 12) * 0.35;
        leftLeg.rotation.x = 0;
        rightLeg.rotation.x = 0;
      } else if (em === 'jump') {
        const jp = (t * 4) % (Math.PI * 2);
        rigBody.position.y = Math.max(0, Math.sin(jp)) * 0.45;
        rigBody.rotation.x = Math.sin(jp) * 0.3;
        leftArm.rotation.z = -1.2;
        rightArm.rotation.z = 1.2;
        leftLeg.rotation.x = 0.3;
        rightLeg.rotation.x = -0.3;
      } else {
        const bounce = Math.sin(t * 3.5) * 0.04;
        rigBody.position.y = bounce;
        headGroup.rotation.y = Math.sin(t * 1.5) * 0.08;
        headGroup.rotation.z = Math.sin(t * 2) * 0.04;
        leftArm.rotation.x = Math.sin(t * 3.5) * 0.12;
        leftArm.rotation.z = -0.15 + Math.cos(t * 3.5) * 0.05;
        rightArm.rotation.x = -Math.sin(t * 3.5) * 0.12;
        rightArm.rotation.z = 0.15 - Math.cos(t * 3.5) * 0.05;
        leftLeg.rotation.x = 0;
        rightLeg.rotation.x = 0;
      }

      if (shadowPlane) {
        const sc = 1 - rigBody.position.y * 0.5;
        shadowPlane.scale.set(sc, sc, sc);
      }
    }

        gl_FragColor=vec4(c,1.);
      }`;
      const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
      const p = gl.createProgram();
      gl.attachShader(p, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
      gl.attachShader(p, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(p);
      gl.useProgram(p);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const a = gl.getAttribLocation(p, 'a');
      gl.enableVertexAttribArray(a);
      gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);

      const u = n => gl.getUniformLocation(p, n), ur = u('r'), ut = u('t'), ul = u('l'), uk = u('k'), uca = u('ca'), ucb = u('cb');
      let tt = 0, L = 0.5;
      
      // FULL RESOLUTION VIEWPORT RESIZE
      const rs = () => {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(window.innerWidth * dpr);
        cv.height = Math.round(window.innerHeight * dpr);
        gl.viewport(0, 0, cv.width, cv.height);
      };
      rs();
      addEventListener('resize', rs);

      const fr = () => {
        L += (bgT - L) * 0.03;
        pulse *= 0.985;
        tt += 0.016 * (1 + pulse * 8);
        gl.uniform2f(ur, cv.width, cv.height);
        gl.uniform1f(ut, tt);
        gl.uniform1f(ul, L);
        gl.uniform1f(uk, isL() ? 1 : 0);
        gl.uniform3fv(uca, PAL().a);
        gl.uniform3fv(ucb, PAL().b);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        RM || requestAnimationFrame(fr);
      };
      fr();
    }

    try {
      if (sessionStorage.getItem('ti')) $('#intro').remove();
    } catch (e) {}

    // Boot router
    route();
  </script>
